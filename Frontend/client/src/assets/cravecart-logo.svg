<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CraveCart logo">
  <defs>
    <linearGradient id="ccg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <path id="topArc" d="M 86 260 A 170 170 0 0 1 426 260"/>
    <path id="bottomArc" d="M 128 440 A 150 150 0 0 0 384 440"/>
  </defs>

  <!-- optional white background (helps match screenshot when placed on tinted navbar) -->
  <rect x="18" y="18" width="476" height="476" rx="36" fill="#FFFFFF"/>

  <!-- Top text -->
  <text
    font-family="ui-serif, Georgia, 'Times New Roman', serif"
    font-size="64"
    font-weight="600"
    fill="#F97316"
    letter-spacing="3"
  >
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CRAVECART</textPath>
  </text>

  <!-- Sparkles -->
  <path d="M88 292 l18 7 l-18 7 l-7 18 l-7-18 l-18-7 l18-7 l7-18 z" fill="#F59E0B" opacity="0.9"/>
  <path d="M424 292 l18 7 l-18 7 l-7 18 l-7-18 l-18-7 l18-7 l7-18 z" fill="#F59E0B" opacity="0.9"/>

  <!-- House + people icon -->
  <g>
    <!-- house outline -->
    <path
      d="M256 162 L176 220 V348 H336 V220 Z"
      fill="none"
      stroke="url(#ccg)"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <path
      d="M192 214 L256 170 L320 214"
      fill="none"
      stroke="url(#ccg)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- chimney (right) -->
    <path d="M320 188 V224" stroke="#DC2626" stroke-width="10" stroke-linecap="round"/>

    <!-- people -->
    <circle cx="256" cy="262" r="16" fill="#FFFFFF" stroke="url(#ccg)" stroke-width="10"/>
    <circle cx="226" cy="268" r="14" fill="#F97316" opacity="0.92"/>
    <circle cx="286" cy="268" r="14" fill="#DC2626" opacity="0.92"/>
    <path d="M216 316 C228 292, 284 292, 296 316" fill="none" stroke="url(#ccg)" stroke-width="10" stroke-linecap="round"/>

    <!-- base line -->
    <path d="M198 352 H314" stroke="url(#ccg)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Bottom text -->
  <text
    font-family="ui-serif, Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="500"
    fill="#F97316"
    letter-spacing="1.2"
  >
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">“HOME KITCHENS, ONE CLICK AWAY.”</textPath>
  </text>
</svg>
